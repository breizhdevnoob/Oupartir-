:root{--ui-font:"Nunito",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif}
html,body{background:#eaf6f8}
.search-screen{position:relative;width:100%;height:100svh;min-height:620px;overflow:hidden;color:#172033;background:#eaf6f8;font-family:var(--ui-font)}

.search-card{position:absolute;z-index:4;left:50%;top:24.2%;transform:translateX(-50%);width:min(92vw,470px);max-width:470px;margin:0;padding:18px 18px 15px;background:rgba(255,255,255,.975);border:1px solid rgba(255,255,255,.95);border-radius:23px;box-shadow:0 14px 38px rgba(9,55,76,.17);backdrop-filter:blur(5px)}
.search-card .field-compact{margin:0 0 11px;position:relative}.search-card label{display:block;margin:0 0 5px 3px;color:#566274;font-size:13px;line-height:1.1;font-weight:800;letter-spacing:.05px}.city-control,.select-wrap{height:49px;border:1px solid #d4dce6;border-radius:13px;background:#fff;display:flex;align-items:center;position:relative}.city-control:focus-within,.select-wrap:focus-within{border-color:#78a6df;box-shadow:0 0 0 3px rgba(37,99,235,.07)}
.field-icon,.field-symbol{width:35px;flex:0 0 35px;text-align:center;color:#2563eb;font-size:17px;font-weight:800}.city-control input,.select-wrap input,.select-wrap select{border:0;outline:0;background:transparent;width:100%;height:100%;min-width:0;padding:0 5px;color:#172033;font-family:var(--ui-font);font-size:17.5px;font-weight:750}.select-wrap select{appearance:none;padding-right:28px;cursor:pointer}.select-wrap:after{content:'⌄';position:absolute;right:11px;color:#667085;font-size:15px;pointer-events:none}.select-wrap input{padding-right:8px}.icon-button,.city-toggle{width:35px;height:35px;flex:0 0 35px;border:0;background:transparent;color:#2563eb;display:flex;align-items:center;justify-content:center;padding:0}.icon-button svg{width:20px;height:20px}.city-toggle{font-size:19px;color:#667085}
.compact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}.city-dropdown{display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:20;background:#fff;border:1px solid #d4dce6;border-radius:13px;box-shadow:0 12px 30px rgba(20,35,55,.15);max-height:190px;overflow:auto;padding:5px}.city-dropdown.open{display:block}.city-option{padding:10px 12px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}.city-option:hover,.city-option.highlight{background:#eef5ff;color:#175cc2}
.transport-field{margin-top:1px}.transport-field>label{margin-bottom:5px}.transport{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.transport button{height:54px;border:1px solid #d4dce6;border-radius:13px;background:#fff;color:#667085;font-family:var(--ui-font);font-weight:800;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.transport button.active{background:#eef5ff;border-color:#78a8ee;color:#1d62c9;box-shadow:inset 0 0 0 1px rgba(37,99,235,.08)}.transport-icon{font-size:22px;line-height:20px}.transport-icon.plus{font-size:24px;line-height:18px}.transport small{font-size:11px;line-height:13px}
.primary.search-button{height:51px;margin-top:12px;border-radius:14px;background:#1769e0;box-shadow:0 6px 14px rgba(23,105,224,.2);font-family:var(--ui-font);font-size:16px;font-weight:900;letter-spacing:.02px}.primary.search-button:hover{background:#1260d1}.search-button span{font-size:21px;vertical-align:-2px;margin-right:3px}.search-card .status{margin:7px 2px 0;text-align:center;font-size:9.5px;line-height:1.25;color:#7d8898;min-height:11px}

@media(max-width:600px){.search-screen{min-height:600px}.search-background{height:61%;background-size:100% 100%,auto 100%;background-position:center top,center top}.search-brand{top:3.4%;gap:9px}.brand-mark{width:52px;height:52px}.brand-copy h1{font-size:34px}.brand-copy p{font-size:13px;margin-top:4px}.search-card{top:23.8%;width:calc(100vw - 24px);padding:18px 15px 15px;border-radius:21px}.search-card .field-compact{margin-bottom:10px}.search-card label{font-size:12.5px}.city-control,.select-wrap{height:48px}.field-icon,.field-symbol{width:32px;flex-basis:32px;font-size:16px}.city-control input,.select-wrap input,.select-wrap select{font-size:17px}.compact-grid{gap:9px;margin-bottom:10px}.transport button{height:52px}.transport-icon{font-size:21px}.transport small{font-size:10px}.primary.search-button{height:49px;margin-top:10px;font-size:15px}.search-card .status{font-size:8.5px}.search-wave{height:52px;bottom:8%}}
@media(max-height:700px){.search-brand{top:2.8%}.brand-mark{width:41px;height:41px}.brand-copy h1{font-size:27px}.brand-copy p{font-size:10.5px}.search-card{top:21%;padding:13px 13px 10px}.search-card .field-compact{margin-bottom:6px}.search-card label{font-size:11px}.city-control,.select-wrap{height:41px}.city-control input,.select-wrap input,.select-wrap select{font-size:15px}.transport button{height:44px}.transport-icon{font-size:17px}.transport small{font-size:8px}.primary.search-button{height:42px;margin-top:7px;font-size:14px}.search-card .status{display:none}.search-wave{display:none}}

<body>
<section id="searchScreen" class="screen active">
  <!-- ========================= ÉCRAN 1 / RECHERCHE ========================= -->
  <div class="search-screen">
    <div class="search-background" aria-hidden="true"></div>
    <div class="search-scrim" aria-hidden="true"></div>

    <header class="search-brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="22" r="11" fill="#ffd34d"/><path d="M10 39c8-7 15-7 22 0s14 7 22 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M8 48c9-7 16-7 24 0s15 7 24 0" fill="none" stroke="#d9f4ff" stroke-width="6" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-copy"><h1>Où partir ?</h1><p>Trouvez la destination idéale grâce à la météo</p></div>
    </header>

    <section class="search-card" aria-label="Paramètres du voyage">
      <div class="city-field field-compact">
        <label for="place">Ville de départ</label>
        <div class="city-control">
          <span class="field-icon" aria-hidden="true">⌖</span>
          <input id="place" value="Rennes" autocomplete="off" placeholder="Votre ville" aria-autocomplete="list" aria-controls="cityDropdown" aria-expanded="false">
          <button type="button" id="locate" class="icon-button" title="Utiliser ma position" aria-label="Utiliser ma position">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button type="button" id="cityToggle" class="city-toggle" aria-label="Afficher la liste des villes">⌄</button>
        </div>
        <div id="cityDropdown" class="city-dropdown" role="listbox"></div>
      </div>

      <div class="compact-grid">
        <div class="field-compact"><label for="date">Quand ?</label><div class="select-wrap"><span class="field-symbol">▣</span><input id="date" type="date"></div></div>
        <div class="field-compact"><label for="duration">Pour combien de temps ?</label><div class="select-wrap"><span class="field-symbol">◷</span><select id="duration"><option value="1">1 jour</option><option value="2">2 jours</option><option selected value="3">3 jours</option><option value="4">4 jours</option><option value="5">5 jours</option><option value="6">6 jours</option><option value="7">7 jours</option></select></div></div>
      </div>

      <div class="field-compact"><label for="maxTime">Jusqu'à combien de temps de trajet ?</label><div class="select-wrap"><span class="field-symbol">⌁</span><select id="maxTime"><option value="1">1 h max</option><option value="2" selected>2 h max</option><option value="3">3 h max</option><option value="4">4 h max</option><option value="6">6 h max</option><option value="8">8 h max</option><option value="999">Peu importe</option></select></div></div>

      <div class="transport-field"><label>Moyen de transport</label><div class="transport transport-compact">
        <button type="button" data-transport="car" class="active"><span class="transport-icon">🚗</span><small>Voiture</small></button>
        <button type="button" data-transport="train"><span class="transport-icon">🚆</span><small>Train</small></button>
        <button type="button" data-transport="bike"><span class="transport-icon">🚲</span><small>Vélo</small></button>
        <button type="button" data-transport="any"><span class="transport-icon">✈️</span><small>Avion</small></button>
      </div></div>
      <input type="hidden" id="transport" value="car">
      <button type="button" id="go" class="primary search-button"><span>⌕</span> Trouver où partir</button>
      <div id="status" class="status">En quelques secondes, découvrez les meilleures destinations selon la météo.</div>
    </section>

    <div class="search-wave" aria-hidden="true"><svg viewBox="0 0 900 150" preserveAspectRatio="none"><path d="M0 86 C120 48 205 106 315 76 S520 42 635 78 S790 112 900 64" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="5"/><path d="M0 108 C120 70 215 127 330 98 S525 66 650 101 S800 132 900 91" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="9"/></svg></div>
  </div>
</section>

<main class="app results-app">
<!-- ========================= ÉCRAN 2 / RÉSULTATS ========================= -->
<section id="resultsScreen" class="screen"><div class="results-layout"><div class="map-card"><div class="map-top"><button type="button" class="secondary back" id="backSearch">← Modifier la recherche</button><div class="trip-chip" id="tripChip"></div></div><div id="map"></div></div><aside class="results-panel"><div class="results-title"><h2>Destinations</h2><span class="desktop-note" id="resultsCount"></span></div><div class="desktop-note" style="margin-bottom:9px">Touchez un marqueur ou une destination pour voir son détail.</div><div id="results"></div></aside></div></section>
</main>
<!-- ========================= ÉCRAN 3 / DÉTAIL ========================= -->
<div id="detail" class="detail-screen"></div>
<script>
window.addEventListener("error", (e) => {
  const el = document.getElementById("status");
  if (el) el.textContent = "Erreur JavaScript : " + (e.message || "erreur inconnue");
});
window.addEventListener("unhandledrejection", (e) => {
  const el = document.getElementById("status");
  if (el) el.textContent = "Erreur : " + (e.reason?.message || e.reason || "requête impossible");
